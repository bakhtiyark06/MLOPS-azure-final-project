[pytest]
# ---------------------------------------------------------------------------
# pytest configuration.
#  - testpaths : where the suite lives
#  - addopts   : enable coverage for the two source packages and fail the run
#                if total coverage drops below the 70% project requirement.
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --cov=app
    --cov=mlops
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
